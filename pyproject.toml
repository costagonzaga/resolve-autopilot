[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-autopilot"
version = "0.1.0"
description = "Automate DaVinci Resolve Studio from Python and Claude Code: timelines, audio mix, look, render."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["davinci-resolve", "video-editing", "automation", "claude-code", "ffmpeg"]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/costagonzaga/resolve-autopilot"
Issues = "https://github.com/costagonzaga/resolve-autopilot/issues"

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg"]
dev = ["pytest"]

[project.scripts]
resolve-autopilot = "resolve_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["resolve_autopilot*"]
